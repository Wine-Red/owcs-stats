name: owcs-stats

services:
  api:
    build:
      context: ${OWCS_SOURCE_DIR:-../..}
      dockerfile: deploy/docker/Dockerfile.backend
    image: owmini/owcs-stats-backend:${OWCS_IMAGE_TAG:-local}
    container_name: owcs-stats-backend
    restart: unless-stopped
    init: true
    env_file:
      - ${OWCS_BACKEND_ENV_FILE:-../../.runtime/backend.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - default
      - 1panel
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    build:
      context: ${OWCS_SOURCE_DIR:-../..}
      dockerfile: deploy/docker/Dockerfile.web
      args:
        VITE_BASE_PATH: /
    image: owmini/owcs-stats-web:${OWCS_IMAGE_TAG:-local}
    container_name: owcs-stats-web
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  1panel:
    external: true
    name: 1panel-network
