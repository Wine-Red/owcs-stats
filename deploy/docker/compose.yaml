name: owcs-stats

services:
  api:
    image: ${OWCS_API_IMAGE:?OWCS_API_IMAGE must reference an immutable image}
    container_name: owcs-stats-backend
    restart: unless-stopped
    init: true
    env_file:
      - ${OWCS_BACKEND_ENV_FILE:-../../.runtime/backend.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      MEDIA_ROOT: /app/media
      EXTERNAL_MATCH_API_BASE: ${EXTERNAL_MATCH_API_BASE:-http://matchweb-app:5000}
    volumes:
      - ${OWCS_MEDIA_DIR:-./data/media}:/app/media
    expose:
      - "3000"
    networks:
      - default
      - 1panel
      - matchweb
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    image: ${OWCS_WEB_IMAGE:?OWCS_WEB_IMAGE must reference an immutable image}
    container_name: owcs-stats-web
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ${OWCS_MEDIA_DIR:-./data/media}:/srv/media:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  1panel:
    external: true
    name: 1panel-network
  matchweb:
    external: true
    name: ${MATCHWEB_DOCKER_NETWORK:-matchweb_default}
