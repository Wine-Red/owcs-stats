# This file is included from the stats.owmini.xyz server block by 1Panel.
# Keep public visualization traffic on a separate, read-only API prefix.

location = /_tinyauth {
    internal;
    proxy_pass http://127.0.0.1:1411/api/auth/nginx;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri $request_uri;
}

location @tinyauth_error {
    return 307 $tinyauth_redirect;
}

location = /visualize {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /visualize/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /assets/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /media/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /heroes/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /icons/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /maps/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /static-data/ {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location = /favicon.ico {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location ^~ /public-api/ {
    limit_except GET {
        deny all;
    }

    proxy_pass http://127.0.0.1:8081/api/;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

location = /data/v1 {
    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
}

# Public data only. The application returns the contract's JSON 405 for writes.
location ^~ /data/v1/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
}

# The old data surface is removed, including for unauthenticated requests.
location = /agent { return 404; }
location ^~ /agent/ { return 404; }

location ^~ /poll-api/ {
    proxy_pass http://127.0.0.1:8081;
    # Replace client-supplied forwarding headers at the public edge.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}

location ^~ / {
    auth_request /_tinyauth;
    auth_request_set $tinyauth_redirect $upstream_http_x_tinyauth_location;
    auth_request_set $tinyauth_remote_user $upstream_http_remote_user;
    error_page 401 403 =307 @tinyauth_error;

    proxy_pass http://127.0.0.1:8081;
    include /www/sites/stats.owmini.xyz/proxy/proxy-headers.inc;
    proxy_set_header Remote-User $tinyauth_remote_user;
}
