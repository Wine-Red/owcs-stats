name: Bootstrap Server Pull Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Install the fixed server command, or install and run a no-switch build
        required: true
        default: dry-run
        type: choice
        options:
          - install
          - dry-run

permissions:
  contents: read

concurrency:
  group: production-deploy-and-static-release
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install and verify server pull deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Install fixed deployment command outside production paths
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: bash .github/scripts/install-server-pull-deployer.sh

      - name: Build and validate without switching production
        if: ${{ inputs.operation == 'dry-run' }}
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_MODE: dry-run
          DEPLOY_SHA: ${{ github.sha }}
        run: bash .github/scripts/run-server-pull-deploy.sh
