name: Deploy OWCS Stats to Tencent

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: owcs-stats-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Test Frontend Units
        run: |
          npm run test:static-export
          npm run test:liquipedia-url
          npm run test:match-schedule
          npm run test:team-roster
          npm run test:embedded-webview
          npm run test:api-base-url

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Test Backend Units
        working-directory: backend
        run: node --test tests/*.test.js

      - name: Check Backend Entrypoints
        run: |
          node --check backend/app.js
          node --check backend/database/index.js
          node --check backend/controllers/MediaController.js
          node --check backend/services/MediaStorageService.js
          node --check backend/scripts/migrate-media-assets.js
          node --check backend/services/IncrementalMatchSyncService.js

      - name: Upload Production Frontend
        uses: actions/upload-artifact@v4
        with:
          name: owcs-stats-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Build and activate on Tencent
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: owcs-stats-frontend-${{ github.sha }}
          path: dist

      - name: Configure restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.OWCS_STATS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OWCS_STATS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/owcs_stats_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/owcs_stats_deploy ~/.ssh/known_hosts

      - name: Prepare and synchronize release candidate
        env:
          DEPLOY_HOST: ${{ secrets.OWCS_STATS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.OWCS_STATS_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.OWCS_STATS_DEPLOY_USER }}
        run: |
          release_dir="$RUNNER_TEMP/owcs-stats-release"
          install -d "$release_dir"
          cp -a backend deploy dist .dockerignore "$release_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/.release-sha"

          ssh -i ~/.ssh/owcs_stats_deploy \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "prepare $GITHUB_SHA"

          export RSYNC_RSH="ssh -i ~/.ssh/owcs_stats_deploy -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=15"
          rsync --archive --checksum --compress --delete --delete-excluded \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='node_modules' \
              --exclude='*.log' \
              --stats \
              "$release_dir/" \
              "$DEPLOY_USER@$DEPLOY_HOST:$GITHUB_SHA/"

      - name: Activate verified release
        env:
          DEPLOY_HOST: ${{ secrets.OWCS_STATS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.OWCS_STATS_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.OWCS_STATS_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/owcs_stats_deploy \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "activate $GITHUB_SHA"
