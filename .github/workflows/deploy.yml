name: Deploy To BT

on:
  push:
    branches:
      - master

concurrency:
  group: production-deploy-and-static-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Clean Frontend Dist
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /www/wwwroot/owcs-stats
            rm -rf /www/wwwroot/owcs-stats/*

      - name: Upload Frontend Dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: "/www/wwwroot/owcs-stats"
          strip_components: 1

      - name: Upload Backend Code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/*"
          target: "/www/wwwroot/owcs-stats-backend"
          strip_components: 1

      - name: Install Backend Dependencies And Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /www/wwwroot/owcs-stats-backend
            npm ci --omit=dev
            /www/server/panel/pyenv/bin/supervisorctl restart owcs-stats-backend:owcs-stats-backend_00

      - name: Wait for production API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              https://owmini.xyz/api/seasons \
              | node -e "let body=''; process.stdin.on('data', chunk => body += chunk); process.stdin.on('end', () => { const data = JSON.parse(body); if (!Array.isArray(data)) process.exit(1); });"; then
              echo "Production API is ready."
              exit 0
            fi
            echo "Production API is not ready yet (attempt $attempt/60)."
            sleep 5
          done
          echo "Production API did not recover within five minutes."
          exit 1
