name: Deploy To BT

on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/workflows/**
      - .github/scripts/**
      - deploy/server-pull/**
      - docs/**
      - scripts/verify-embedded-webview.mjs
      - src/utils/embeddedWebView.test.mjs
  workflow_dispatch:

concurrency:
  group: production-deploy-and-static-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Test Backend Units
        working-directory: backend
        run: node --test tests/*.test.js

      - name: Check Backend Entrypoints
        run: |
          node --check backend/app.js
          node --check backend/database/index.js
          node --check backend/services/IncrementalMatchSyncService.js

  deploy:
    name: Pull, build, verify, and activate on server
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout deployment control scripts
        uses: actions/checkout@v4

      - name: Run fixed server-side deployment
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_MODE: deploy
          DEPLOY_SHA: ${{ github.sha }}
        run: bash .github/scripts/run-server-pull-deploy.sh
