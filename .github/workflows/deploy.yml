name: Deploy OWCS Stats to Tencent

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: owcs-stats-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  OWCS_API_IMAGE: ghcr.io/wine-red/owcs-stats-backend
  OWCS_WEB_IMAGE: ghcr.io/wine-red/owcs-stats-web

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Test Frontend Units
        run: |
          npm run test:static-export
          npm run test:liquipedia-url
          npm run test:match-schedule
          npm run test:team-roster
          npm run test:embedded-webview
          npm run test:api-base-url

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Test Backend Units
        working-directory: backend
        run: node --test tests/*.test.js

      - name: Check Backend Entrypoints
        run: |
          node --check backend/app.js
          node --check backend/database/index.js
          node --check backend/database/teamAliasMigration.js
          node --check backend/database/membershipEvidenceMigration.js
          node --check backend/controllers/TeamController.js
          node --check backend/controllers/SeasonTeamController.js
          node --check backend/controllers/SeasonTeamPlayerController.js
          node --check backend/controllers/MediaController.js
          node --check backend/services/MembershipSourceService.js
          node --check backend/services/TeamAliasService.js
          node --check backend/services/MediaStorageService.js
          node --check backend/scripts/migrate-media-assets.js
          node --check backend/scripts/audit-membership-evidence.js
          node --check backend/services/IncrementalMatchSyncService.js

      - name: Upload Production Frontend
        uses: actions/upload-artifact@v4
        with:
          name: owcs-stats-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-images:
    name: Build and verify images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v5

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: owcs-stats-frontend-${{ github.sha }}
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cached backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          load: true
          push: false
          provenance: false
          tags: ${{ env.OWCS_API_IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=owcs-stats-backend
          cache-to: type=gha,mode=max,scope=owcs-stats-backend

      - name: Build cached web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          load: true
          push: false
          provenance: false
          tags: ${{ env.OWCS_WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=owcs-stats-web
          cache-to: type=gha,mode=max,scope=owcs-stats-web

      - name: Smoke test immutable images
        run: |
          api_image="$OWCS_API_IMAGE:$GITHUB_SHA"
          web_image="$OWCS_WEB_IMAGE:$GITHUB_SHA"
          docker run --rm --network none "$api_image" node --check app.js
          docker run --rm --network none --add-host api:127.0.0.1 \
            "$web_image" nginx -t

      - name: Publish immutable images
        run: |
          docker push "$OWCS_API_IMAGE:$GITHUB_SHA"
          docker push "$OWCS_WEB_IMAGE:$GITHUB_SHA"

  deploy:
    name: Activate images on Tencent
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download validated frontend
        uses: actions/download-artifact@v4
        with:
          name: owcs-stats-frontend-${{ github.sha }}
          path: dist

      - name: Configure restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.OWCS_STATS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OWCS_STATS_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/owcs_stats_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/owcs_stats_deploy ~/.ssh/known_hosts

      - name: Prepare and synchronize release candidate
        env:
          DEPLOY_HOST: ${{ secrets.OWCS_STATS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.OWCS_STATS_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.OWCS_STATS_DEPLOY_USER }}
        run: |
          api_image="$OWCS_API_IMAGE:$GITHUB_SHA"
          web_image="$OWCS_WEB_IMAGE:$GITHUB_SHA"
          release_dir="$RUNNER_TEMP/owcs-stats-release"
          install -d "$release_dir"
          cp -a backend deploy dist .dockerignore "$release_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/.release-sha"

          ssh -i ~/.ssh/owcs_stats_deploy \
              -p "$DEPLOY_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=20 \
              -o ServerAliveCountMax=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "prepare $GITHUB_SHA $api_image $web_image"

          export RSYNC_RSH="ssh -i ~/.ssh/owcs_stats_deploy -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=15"
          rsync --archive --checksum --compress --delete --delete-excluded \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='node_modules' \
              --exclude='*.log' \
              --stats \
              "$release_dir/" \
              "$DEPLOY_USER@$DEPLOY_HOST:$GITHUB_SHA/"

      - name: Activate verified release
        env:
          DEPLOY_HOST: ${{ secrets.OWCS_STATS_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.OWCS_STATS_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.OWCS_STATS_DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_image="$OWCS_API_IMAGE:$GITHUB_SHA"
          web_image="$OWCS_WEB_IMAGE:$GITHUB_SHA"
          printf '%s\n' "$REGISTRY_TOKEN" \
            | ssh -i ~/.ssh/owcs_stats_deploy \
                -p "$DEPLOY_PORT" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o ServerAliveInterval=20 \
                -o ServerAliveCountMax=15 \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "activate $GITHUB_SHA $api_image $web_image $GITHUB_ACTOR"
