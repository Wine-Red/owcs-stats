name: Deploy To BT

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy-and-static-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Package Deployment Bundles
        run: |
          tar -czf frontend-dist.tar.gz -C dist .
          tar \
            --exclude='./node_modules' \
            --exclude='./.env' \
            -czf backend-code.tar.gz \
            -C backend .
          test -s frontend-dist.tar.gz
          test -s backend-code.tar.gz

      - name: Upload Deployment Bundles With Rsync
        timeout-minutes: 12
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_ID: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh_dir="$RUNNER_TEMP/owcs-stats-ssh"
          deploy_key="$ssh_dir/deploy_key"
          known_hosts="$ssh_dir/known_hosts"
          remote_dir="/www/wwwroot/.owcs-stats-deploy/$DEPLOY_ID"

          rm -rf -- "$ssh_dir"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"
          trap 'rm -rf -- "$ssh_dir"' EXIT

          ssh-keyscan -T 20 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$known_hosts"
          ssh_args=(
            -i "$deploy_key"
            -p "$DEPLOY_PORT"
            -o "UserKnownHostsFile=$known_hosts"
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          remote="$DEPLOY_USER@$DEPLOY_HOST"

          ssh "${ssh_args[@]}" "$remote" \
            "mkdir -p '$remote_dir' && df -h /www/wwwroot && df -i /www/wwwroot && command -v rsync"

          export RSYNC_RSH="ssh -i $deploy_key -p $DEPLOY_PORT -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          uploaded=false
          for attempt in 1 2 3; do
            if rsync \
              --archive \
              --partial \
              --append-verify \
              --timeout=120 \
              --info=progress2 \
              frontend-dist.tar.gz \
              backend-code.tar.gz \
              "$remote:$remote_dir/"; then
              uploaded=true
              break
            fi
            echo "Rsync upload failed (attempt $attempt/3); retrying with the partial file."
            sleep 10
          done

          if [ "$uploaded" != true ]; then
            echo "Rsync upload failed after three attempts."
            exit 1
          fi

          ssh "${ssh_args[@]}" "$remote" \
            "test -s '$remote_dir/frontend-dist.tar.gz' && test -s '$remote_dir/backend-code.tar.gz'"

      - name: Validate And Activate Deployment
        uses: appleboy/ssh-action@v1.2.0
        timeout-minutes: 10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 9m
          script: |
            set -eu

            deploy_root="/www/wwwroot"
            deploy_id="${{ github.sha }}"
            bundle_dir="$deploy_root/.owcs-stats-deploy/$deploy_id"
            frontend_live="$deploy_root/owcs-stats"
            frontend_stage="$deploy_root/.owcs-stats-frontend-$deploy_id"
            frontend_previous="$deploy_root/.owcs-stats-frontend-previous"
            backend_live="$deploy_root/owcs-stats-backend"
            backend_stage="$deploy_root/.owcs-stats-backend-$deploy_id"
            backend_previous="$deploy_root/.owcs-stats-backend-previous"
            supervisorctl="/www/server/panel/pyenv/bin/supervisorctl"

            rm -rf -- "$frontend_stage" "$backend_stage"
            mkdir -p "$frontend_stage" "$backend_stage"
            tar -xzf "$bundle_dir/frontend-dist.tar.gz" -C "$frontend_stage"
            tar -xzf "$bundle_dir/backend-code.tar.gz" -C "$backend_stage"

            test -s "$frontend_stage/index.html"
            test -s "$backend_stage/package.json"
            test -s "$backend_stage/app.js"

            if [ ! -f "$backend_live/.env" ]; then
              echo "Backend environment file is missing: $backend_live/.env"
              exit 1
            fi
            cp -p "$backend_live/.env" "$backend_stage/.env"

            cd "$backend_stage"
            npm ci --omit=dev
            node --check app.js

            rm -rf -- "$backend_previous"
            if [ -d "$backend_live" ]; then
              mv "$backend_live" "$backend_previous"
            fi
            mv "$backend_stage" "$backend_live"

            if ! "$supervisorctl" restart owcs-stats-backend:owcs-stats-backend_00; then
              rm -rf -- "$backend_live"
              if [ -d "$backend_previous" ]; then
                mv "$backend_previous" "$backend_live"
                "$supervisorctl" restart owcs-stats-backend:owcs-stats-backend_00 || true
              fi
              echo "Backend restart failed; restored the previous deployment."
              exit 1
            fi

            rm -rf -- "$frontend_previous"
            if [ -d "$frontend_live" ]; then
              mv "$frontend_live" "$frontend_previous"
            fi
            if ! mv "$frontend_stage" "$frontend_live"; then
              if [ -d "$frontend_previous" ]; then
                mv "$frontend_previous" "$frontend_live"
              fi
              echo "Frontend activation failed; restored the previous deployment."
              exit 1
            fi

            rm -rf -- "$bundle_dir"

      - name: Wait for production API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              https://owmini.xyz/api/seasons \
              | node -e "let body=''; process.stdin.on('data', chunk => body += chunk); process.stdin.on('end', () => { const data = JSON.parse(body); if (!Array.isArray(data)) process.exit(1); });"; then
              echo "Production API is ready."
              exit 0
            fi
            echo "Production API is not ready yet (attempt $attempt/60)."
            sleep 5
          done
          echo "Production API did not recover within five minutes."
          exit 1
