name: Recover Production Static Site

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect both trees, or atomically restore the static site from the retained frontend
        required: true
        default: audit
        type: choice
        options:
          - audit
          - recover

permissions:
  contents: read

concurrency:
  group: production-deploy-and-static-release
  cancel-in-progress: false

jobs:
  recover:
    name: Audit or recover production static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovery command
        uses: actions/checkout@v4

      - name: Audit or atomically recover the static site
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RECOVERY_MODE: ${{ inputs.operation }}
        run: bash .github/scripts/recover-production-static-site.sh
