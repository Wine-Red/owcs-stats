components:
  schemas:
    EntityRef:
      type: object
      description: 稳定实体的简要引用。
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 显示名称；可变且不保证全局唯一。
          minLength: 1
    Competition:
      type: object
      description: 一个独立赛事条目，不等同于自然年度或整届全球巡回赛。
      additionalProperties: false
      required:
      - id
      - name
      - status
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 独立收录的赛事名称。
          minLength: 1
        status:
          type: string
          description: 赛事目录状态；不保证该赛事全部比赛已收录。
          enum:
          - in_progress
          - completed
    Stage:
      type: object
      description: 比赛阶段归属以 Match.stage 为准；不返回内部阶段边界配置。
      additionalProperties: false
      required:
      - id
      - competition_id
      - name
      - sequence
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        competition_id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 赛事内部阶段名称。
          minLength: 1
        sequence:
          type: integer
          minimum: 1
          description: 该赛事中的阶段顺序，从 1 开始。
    Team:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - aliases
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 队伍显示名称。
          minLength: 1
        aliases:
          type: array
          items:
            type: string
            description: 已确认的队伍名称别称。
            minLength: 1
          description: 仅返回已确认别名；不自动推断战队历史继承关系。
    Player:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - role
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 选手显示名称；同名不等于同人。
          minLength: 1
        role:
          type: string
          description: 选手为目录位置，英雄为职责分类；目录位置不证明每一场的实际位置。
          enum:
          - tank
          - damage
          - support
    Map:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - mode
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 地图名称。
          minLength: 1
        mode:
          type: string
          description: 地图比赛模式。
          enum:
          - control
          - escort
          - hybrid
          - push
          - flashpoint
    Hero:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - role
      - sub_role
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        name:
          type: string
          description: 英雄名称。
          minLength: 1
        role:
          type: string
          description: 选手为目录位置，英雄为职责分类；目录位置不证明每一场的实际位置。
          enum:
          - tank
          - damage
          - support
        sub_role:
          anyOf:
          - type: string
            description: 目录中的细分职责；不是比赛时的英雄版本信息。
          - type: 'null'
    HeroRef:
      type: object
      description: id 为 null 不等于没有使用该英雄。
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          anyOf:
          - type: integer
            minimum: 1
            description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
          - type: 'null'
        name:
          type: string
          description: 英雄名称；未完成目录映射时保留已记录名称。
          minLength: 1
    TeamResult:
      type: object
      additionalProperties: false
      required:
      - team
      - score
      properties:
        team:
          $ref: '#/components/schemas/EntityRef'
        score:
          anyOf:
          - type: integer
            minimum: 0
            description: 该队已记录得分；缺失或不能可靠解释时为 null。
          - type: 'null'
    Match:
      type: object
      description: 结果库中的一场系列赛。team1/team2 是固定存储侧位，不表示主客场、攻守方或强弱。比分是系列赛大场比分。
      additionalProperties: false
      required:
      - id
      - competition
      - stage
      - date
      - format
      - team1
      - team2
      - winner_team_id
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        competition:
          $ref: '#/components/schemas/EntityRef'
        stage:
          anyOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        date:
          type: string
          description: 已记录的比赛日历日期。没有开赛时刻，不转换成午夜时间戳。
          format: date
        format:
          anyOf:
          - type: string
            description: BO 后接最多比赛局数，例如 BO5。未确认时 null。
            pattern: ^BO[1-9][0-9]*$
          - type: 'null'
        team1:
          $ref: '#/components/schemas/TeamResult'
        team2:
          $ref: '#/components/schemas/TeamResult'
        winner_team_id:
          anyOf:
          - type: integer
            minimum: 1
            description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
          - type: 'null'
    GameTeamResult:
      type: object
      description: banned_hero=null 表示没有可用 Ban 记录，不证明没有 Ban。
      additionalProperties: false
      required:
      - team
      - score
      - banned_hero
      properties:
        team:
          $ref: '#/components/schemas/EntityRef'
        score:
          anyOf:
          - type: integer
            minimum: 0
            description: 单张地图已记录的模式相关成绩值。原始存储只保留整数，可能缺少推进距离等精度信息；不得据此重新推断胜方。
          - type: 'null'
        banned_hero:
          anyOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
    PlayerStatsCoverage:
      type: object
      additionalProperties: false
      required:
      - status
      - recorded_players
      - expected_players
      properties:
        status:
          type: string
          description: recorded=当前标准 5v5 地图双方各五名有效唯一选手统计；partial=有记录但未达完整结构；not_recorded=无记录。仅说明记录结构，不证明采集准确率。
          enum:
          - recorded
          - partial
          - not_recorded
        recorded_players:
          type: integer
          minimum: 0
          description: 本地图有效且唯一的选手统计记录数。
        expected_players:
          type: integer
          minimum: 10
          description: 本版仅覆盖标准 5v5 赛事，预期双方合计 10 人。
          maximum: 10
    Game:
      type: object
      description: 系列赛中的一张地图局。相同地图可以重复出现，必须按 id 区分。
      additionalProperties: false
      required:
      - id
      - match_id
      - number
      - map
      - team1
      - team2
      - winner_team_id
      - duration_seconds
      - replay_code
      - player_stats_coverage
      properties:
        id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        match_id:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
        number:
          anyOf:
          - type: integer
            minimum: 1
            description: 经确认的系列赛地图局序号，从 1 开始；无法恢复真实顺序时 null。
          - type: 'null'
        map:
          $ref: '#/components/schemas/Map'
        team1:
          $ref: '#/components/schemas/GameTeamResult'
        team2:
          $ref: '#/components/schemas/GameTeamResult'
        winner_team_id:
          anyOf:
          - type: integer
            minimum: 1
            description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
          - type: 'null'
        duration_seconds:
          anyOf:
          - type: integer
            minimum: 1
            description: 地图游戏时长（秒）；内部分钟值乘 60 后四舍五入。不是视频长度。0/无效/未记录返回 null。
          - type: 'null'
        replay_code:
          anyOf:
          - type: string
            description: 已记录的游戏内回放代码；不保证长期有效。
            minLength: 1
          - type: 'null'
        player_stats_coverage:
          $ref: '#/components/schemas/PlayerStatsCoverage'
    PlayerMetrics:
      type: object
      description: 每个字段均存在。null=没有足够证据提供该值，0=有效记录中的零值；不得将解析失败强制写成零。
      additionalProperties: false
      required:
      - eliminations
      - assists
      - deaths
      - damage
      - healing
      - damage_mitigated
      - final_blows
      - ultimates_used
      properties:
        eliminations:
          anyOf:
          - type: integer
            minimum: 0
            description: 记分板淘汰数，可由多人共同获得；不是最后一击。
          - type: 'null'
        assists:
          anyOf:
          - type: integer
            minimum: 0
            description: 记分板助攻数。
          - type: 'null'
        deaths:
          anyOf:
          - type: integer
            minimum: 0
            description: 记分板死亡数。
          - type: 'null'
        damage:
          anyOf:
          - type: integer
            minimum: 0
            description: 记分板伤害量。
          - type: 'null'
        healing:
          anyOf:
          - type: integer
            minimum: 0
            description: 记分板治疗量。
          - type: 'null'
        damage_mitigated:
          anyOf:
          - type: integer
            minimum: 0
            description: 记分板承受/阻挡统计中的伤害减免量。
          - type: 'null'
        final_blows:
          anyOf:
          - type: integer
            minimum: 0
            description: 有独立有效采集证据的整局最后一击次数。默认值或空英雄表不能证明真实零。
          - type: 'null'
        ultimates_used:
          anyOf:
          - type: integer
            minimum: 0
            description: 有完整采集证据的整局终极技能使用次数。不得用经过短时英雄过滤的汇总冒充完整总数。
          - type: 'null'
    HeroMetrics:
      type: object
      description: 没有英雄级伤害/治疗/淘汰字段；不得把整局记分板指标按使用比例分配到英雄。
      additionalProperties: false
      required:
      - usage_seconds
      - usage_percentage
      - final_blows
      - death_events
      - ultimate_ready_events
      - ultimates_used
      - average_ultimate_charge_seconds
      properties:
        usage_seconds:
          anyOf:
          - type: integer
            minimum: 0
            description: 该英雄已记录使用时长（秒）。
          - type: 'null'
        usage_percentage:
          anyOf:
          - type: number
            minimum: 0
            description: 占该选手本局已识别英雄总时长的百分比，范围 0–100。当前源汇总可能过滤短时英雄，返回项的百分比之和可小于 100。
            maximum: 100
          - type: 'null'
        final_blows:
          anyOf:
          - type: integer
            minimum: 0
            description: 归属于该英雄的已记录最后一击次数。
          - type: 'null'
        death_events:
          anyOf:
          - type: integer
            minimum: 0
            description: 归属于该英雄的去重死亡事件数；可能包含独立 death 事件，不保证每次都有最后一击记录。
          - type: 'null'
        ultimate_ready_events:
          anyOf:
          - type: integer
            minimum: 0
            description: 该英雄的终极技能就绪事件次数。
          - type: 'null'
        ultimates_used:
          anyOf:
          - type: integer
            minimum: 0
            description: 该英雄的已记录终极技能使用次数。
          - type: 'null'
        average_ultimate_charge_seconds:
          anyOf:
          - type: number
            minimum: 0
            description: 源数据对相邻选角、换英雄或上次使用等边界到就绪事件间隔的均值（秒）；非严格游戏机制充能效率。
          - type: 'null'
    HeroStatsItem:
      type: object
      additionalProperties: false
      required:
      - hero
      - metrics
      properties:
        hero:
          $ref: '#/components/schemas/HeroRef'
        metrics:
          $ref: '#/components/schemas/HeroMetrics'
    HeroStats:
      type: object
      additionalProperties: false
      required:
      - status
      - items
      properties:
        status:
          type: string
          description: recorded=存在可用英雄明细；not_recorded=没有可用记录。recorded 不保证包含短时英雄或完整时间线。
          enum:
          - recorded
          - not_recorded
        items:
          type: array
          items:
            $ref: '#/components/schemas/HeroStatsItem'
          description: 未记录时必须为空数组；记录时至少一项。
      allOf:
      - if:
          properties:
            status:
              const: not_recorded
        then:
          properties:
            items:
              maxItems: 0
      - if:
          properties:
            status:
              const: recorded
        then:
          properties:
            items:
              minItems: 1
    PlayerGameStats:
      type: object
      description: 唯一键为 (game_id, team.id, player.id)。不暴露会在同步中重建的统计行 ID。player.role 仍为目录位置。
      additionalProperties: false
