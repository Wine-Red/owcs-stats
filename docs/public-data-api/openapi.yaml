        schema:
          type: string
          description: 赛事目录状态；不保证该赛事全部比赛已收录。
          enum:
          - in_progress
          - completed
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 成功。
