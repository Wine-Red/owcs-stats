openapi: 3.1.1
info:
  title: OWCS Public Data API
  version: 1.0.0
  description: 对外赛事数据 API 契约。旧 /agent/v1 已移除，不提供兼容转发。只提供赛事事实、名单、统计和必要的覆盖信息，不提供 AI 问答、SQL 执行、排行榜推断或系统管理数据。详见 README.md、data-dictionary.md
    与 integration.md。
servers:
- url: /data/v1
  description: 同源服务路径。
- url: https://stats.owmini.xyz/data/v1
  description: 生产服务。
security: []
tags:
- name: 基础目录
  description: 稳定实体目录。
- name: 赛事
  description: 独立赛事、赛事内部阶段及覆盖。
- name: 名单
  description: 赛事参赛队伍及名单归属。
- name: 比赛
  description: 已收录系列赛结果。
- name: 地图与统计
  description: 比赛子资源及完整数据包。
- name: 赛程
  description: 独立于结果库的近期赛程提示。
paths:
  /competitions:
    get:
      tags:
      - 赛事
      operationId: listCompetitions
      summary: 查询赛事目录
      description: 按 id 升序；不按名称拆分、合并赛事，不根据标题自动生成赛区或年度字段。
      parameters:
      - $ref: '#/components/parameters/q'
      - name: status
        in: query
        description: 按赛事目录状态筛选。
        schema:
          type: string
          description: 赛事目录状态；不保证该赛事全部比赛已收录。
          enum:
          - in_progress
          - completed
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 成功。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionList'
        '304':
          description: 当前公开表示未改变；无响应正文。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '410':
          $ref: '#/components/responses/Error410'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    head:
      tags:
      - 赛事
      operationId: listCompetitionsHeaders
      summary: 查询赛事目录（仅响应头）
      description: 按 id 升序；不按名称拆分、合并赛事，不根据标题自动生成赛区或年度字段。
      parameters:
      - $ref: '#/components/parameters/q'
