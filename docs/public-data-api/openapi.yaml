      schema:
        type: integer
        minimum: 1
        description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
    map_id:
      name: map_id
      in: path
      required: true
      description: 资源 ID；父子资源不匹配返回 404。
      schema:
        type: integer
        minimum: 1
        description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
    limit:
      name: limit
      in: query
      description: 每页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    cursor:
      name: cursor
      in: query
      description: 沿用上一页全部筛选参数和 limit，原样传入下一页令牌。令牌绑定查询条件与有效期，不保证跨页数据库快照。
      schema:
        type: string
        maxLength: 4096
    q:
      name: q
      in: query
      description: 名称包含查询串，忽略大小写并规范空白；% 和 _ 按普通字符，不是通配符；规范后空字符串无效。按 ID 返回全部候选。队伍同时检索已确认 aliases；不自动合并同名实体。
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: 上一次相同请求的 ETag，用于条件 GET/HEAD。
      schema:
        type: string
  headers:
