        result_consistency:
          type: string
          description: 仅比较已记录系列赛比分与地图胜方计数。consistent=全部已收录地图胜方明确且双方胜图数等于大场分数；conflicting=任一队已记录胜图数超出大场分数；其他为 insufficient_data。不能作为官方数据完整性或准确率证明。
          enum:
          - consistent
          - conflicting
          - insufficient_data
