      description: 公开响应表示的验证器，涵盖所有公开子数据；不能只用父比赛的更新时间。
      schema:
        type: string
    Cache-Control:
      description: 普通赛事查询使用 public, max-age=0, must-revalidate。缓存复用前须验证。
      schema:
        type: string
