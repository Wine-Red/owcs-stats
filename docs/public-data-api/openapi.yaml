      - name: stage_id
        in: query
        description: 仅在同时提供 competition_id 时有效；必须属于该赛事。
        schema:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
      - name: team_id
        in: query
        description: 匹配比赛任一队伍。
        schema:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
      - name: opponent_id
        in: query
        description: 必须与 team_id 一同使用；两者不同，匹配两队直接交手，忽略队伍侧位。
        schema:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
      - name: player_id
        in: query
        description: 仅匹配至少一张地图实际有该选手统计的比赛，不按赛事名单推断出场。
        schema:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
      - name: map_id
        in: query
        description: 至少有一张该地图的比赛；使用 EXISTS 筛选，不重复返回系列赛。
        schema:
          type: integer
          minimum: 1
          description: 当前数据集内稳定的赛事资源标识；不得按名称代替 ID，也不得假设跨环境 ID 一致。
      - name: date_from
        in: query
        description: 比赛日期下界，包含当天。
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: 比赛日期上界，包含当天；不得早于 date_from。
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/IfNoneMatch'
