      summary: 查询已收录系列赛
      description: 按 date 降序、id 降序。所有筛选条件为 AND；player_id 与 team_id 同时存在时，须有该选手代表该队的实际统计行；player_id 与 map_id 同时存在时，须在同一地图局统计行上满足；三者同时存在时在同一条选手地图统计上满足。用
        EXISTS 避免关联展开造成重复比赛。未知资源筛选返回 404，合法资源无结果返回空列表。
